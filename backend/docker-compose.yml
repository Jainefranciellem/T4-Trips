name: t4trips

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: t4trips
      POSTGRES_PASSWORD: t4trips
      POSTGRES_DB: t4trips
    ports:
      - "5433:5432"
    volumes:
      - t4trips_pgdata:/var/lib/postgresql/data

volumes:
  t4trips_pgdata:
