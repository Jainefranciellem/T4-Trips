# API no Render (plano gratuito). O banco fica no Neon (Postgres gratuito,
# sem prazo de validade): DATABASE_URL é a conexão com pooler e DIRECT_URL a
# direta, usada pelas migrações. Passo a passo em docs/implantacao.md.
services:
  - type: web
    name: t4trips-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: PORT
        value: 3333
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: API_URL
        sync: false
      # Comprovantes num bucket privado do Cloudflare R2.
      - key: STORAGE_DRIVER
        value: s3
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
