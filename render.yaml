services:
  - type: web
    name: t4trips-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: t4trips-db
          property: connectionString
      - key: PORT
        value: 3333
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: INTERNAL_JOB_SECRET
        generateValue: true
      - key: REMINDER_JOB_CRON
        value: "*/15 * * * *"

databases:
  - name: t4trips-db
    plan: free
