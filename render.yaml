services:
  - type: web
    name: t4trips-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: t4trips-db
          property: connectionString
      - key: PORT
        value: 3333
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: INTERNAL_JOB_SECRET
        generateValue: true
      - key: REMINDER_JOB_CRON
        value: "*/15 * * * *"
      - key: APP_URL
        sync: false
      - key: API_URL
        sync: false
      # Comprovantes num bucket privado do Cloudflare R2.
      - key: STORAGE_DRIVER
        value: s3
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: RESEND_API_KEY
        sync: false

databases:
  - name: t4trips-db
    plan: free
