<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- Título -->
  <title>T4 Trips Manager</title>

  <!-- ==================== ÍCONES IOS (PRIORIDADE MÁXIMA) ==================== -->
  <!-- iOS usa estes ícones ANTES do manifest.json -->
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/icon-180.png">
  <link rel="apple-touch-icon" sizes="167x167" href="/icon-180.png">
  <link rel="apple-touch-icon" sizes="120x120" href="/icon-180.png">

  <!-- ==================== META TAGS IOS ==================== -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="T4 Trips">

  <!-- ==================== PWA MANIFEST ==================== -->
  <link rel="manifest" href="/manifest.json">

  <!-- ==================== THEME COLOR ==================== -->
  <meta name="theme-color" content="#f47b20">
  <meta name="msapplication-TileColor" content="#f47b20">

  <!-- ==================== FAVICONS PADRÃO ==================== -->
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
  <link rel="shortcut icon" href="/icon-180.png">

  <!-- ==================== META TAGS GERAIS ==================== -->
  <meta name="description" content="Gestão de excursões e viagens de surf da T4 Trips">
  <meta name="mobile-web-app-capable" content="yes">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
